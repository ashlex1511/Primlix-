<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up - Primlix</title>
    <link rel="stylesheet" href="../css/signup.css" />
  </head>
  <body>
    <header class="app"><div class="brand">Primlix</div></header>

    <div class="signup-container">
      <h2>Create Account</h2>

      <form id="signupForm" novalidate autocomplete="off">
        <div class="field">
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
            aria-label="Full Name"
          />
        </div>

        <div class="field">
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
            aria-label="Email Address"
          />
        </div>

        <div class="field">
          <input
            type="password"
            id="password"
            placeholder="Create a password (min 8 characters)"
            required
            minlength="8"
            aria-label="Password"
          />
        </div>

        <div class="field">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
            aria-label="Confirm Password"
          />
        </div>

        <div class="actions-row">
          <button type="submit" class="pill pill-primary">Sign Up</button>
        </div>
        <p id="message" class="error-message"></p>

        <div class="social-signup">
          <div class="divider"><span>OR</span></div>
          <div class="social-buttons">
            <button id="googleSignup" type="button" class="social-btn">
              <img
                src="https://developers.google.com/identity/images/g-logo.png"
                alt="Google"
              />
              Continue with Google
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="login-link">
      Already have an account? <a href="signin.html">Sign In</a>
    </div>

    <script type="module" src="../js/signup.js"></script>
  </body>
</html>
